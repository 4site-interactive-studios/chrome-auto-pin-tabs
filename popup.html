<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Auto Pin Tabs</title>
  <style>
    :root {
      --ink: #1c2230;
      --muted: #6b7280;
      --paper: #ffffff;
      --panel: #f6f6f4;
      --line: #e6e6e2;
      --line-strong: #cfcfca;
      --accent: #2f6f6a;
      --accent-ink: #234f4b;
      --accent-wash: #eef5f4;
      --danger: #a23b3b;
    }
    * { box-sizing: border-box; }
    body {
      width: 320px;
      margin: 0;
      font: 13px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink);
      background: var(--paper);
    }
    section { padding: 12px 14px; border-bottom: 1px solid var(--line); }
    h2 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
      font-weight: 600;
      margin: 0 0 8px;
    }
    .name { font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .url { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 1px 0 10px; }
    .hint { color: var(--muted); font-size: 12px; min-height: 1.2em; margin: 8px 0 0; }
    .pins { list-style: none; margin: 0; padding: 0; max-height: 280px; overflow-y: auto; }
    .pin { display: flex; align-items: center; gap: 6px; padding: 5px 0; border-top: 1px solid var(--line); }
    .pin:first-child { border-top: 0; }
    .pin .name { flex: 1; min-width: 0; font-weight: 500; }
    .pin.dragging { opacity: 0.5; }
    .handle { cursor: grab; color: var(--line-strong); font-size: 13px; padding: 0 2px; user-select: none; }
    input.rename {
      flex: 1;
      min-width: 0;
      font: inherit;
      color: var(--ink);
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      padding: 3px 8px;
    }
    button.iconbtn { color: var(--muted); border-color: transparent; background: transparent; padding: 3px 6px; font-size: 13px; line-height: 1; }
    button.iconbtn:hover { background: var(--accent-wash); border-color: transparent; }
    .empty { color: var(--muted); margin: 2px 0 0; }
    footer { display: flex; gap: 8px; padding: 12px 14px; }
    button {
      font: inherit;
      cursor: pointer;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      padding: 7px 12px;
    }
    button:hover { border-color: #b9b9b3; }
    button:disabled { opacity: 0.55; cursor: default; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; width: 100%; }
    button.primary:hover:not(:disabled) { background: var(--accent-ink); border-color: var(--accent-ink); }
    button.danger { color: var(--danger); border-color: transparent; background: transparent; padding: 3px 8px; font-size: 14px; line-height: 1; }
    button.danger:hover { background: #fbeeee; border-color: transparent; }
    footer button { flex: 1; font-size: 12.5px; padding: 7px 8px; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <section id="current">
    <div id="tabTitle" class="name"></div>
    <div id="tabUrl" class="url"></div>
    <button id="pinTab" type="button" class="primary">Pin this tab</button>
    <p id="hint" class="hint"></p>
  </section>
  <section>
    <h2>Pins</h2>
    <ul id="pinList" class="pins"></ul>
    <p id="empty" class="empty" hidden>No pins yet.</p>
  </section>
  <footer>
    <button id="applyNow" type="button">Apply to this window</button>
    <button id="manage" type="button">Manage pins&#8230;</button>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
